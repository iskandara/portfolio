backend:
  name: github
  repo: iskandara/portfolio
  branch: main            # change to "master" if that's your default branch
  # Optional: nicer "Sign in with GitHub" button via a free Cloudflare Worker
  # (https://github.com/sveltia/sveltia-cms-auth). Without it, sign in with a
  # GitHub Personal Access Token on the /admin login screen - no setup needed.
  # base_url: https://YOUR-AUTH-WORKER.workers.dev

media_folder: "content/images"     # where uploaded images are committed
public_folder: "/content/images"   # how the site references them

# Tip: for local testing run `npx decap-server` and set local_backend: true
# local_backend: true

site_url: https://portfolio.iskandara.workers.dev   # change to your custom domain later
display_url: https://portfolio.iskandara.workers.dev

# Hide the side-by-side preview. Use the "Preview" button in the editor instead,
# which opens the project on your live site in a new tab.
editor:
  preview: false

collections:
  - name: "works"
    label: "Projects"
    label_singular: "Project"
    icon: work
    description: "Your portfolio projects. Click one to edit it, or press New Project."
    folder: "content/works"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    identifier_field: id
    summary: "{{title}} - {{cat}}"
    thumbnail: thumb
    preview_path: "/#work/{{slug}}"
    sortable_fields:
      fields: [order, title]
      default: { field: order, direction: Ascending }
    view_filters:
      - { label: "Design", field: cats, pattern: "design" }
      - { label: "Development", field: cats, pattern: "development" }
      - { label: "E-commerce", field: cats, pattern: "ecommerce" }
      - { label: "Research", field: cats, pattern: "research" }
    editor:
      preview: false
    fields:
      - { name: order, label: "Order on site (1 = first)", widget: number, value_type: int, min: 1, default: 99 }
      - { name: id, label: "ID (URL slug, no spaces)", widget: string }
      - { name: title, label: "Title", widget: string }
      - { name: cat, label: "Card label (e.g. Website design)", widget: string }
      - { name: cats, label: "Filter tags", widget: select, multiple: true,
          options: [design, development, ecommerce, research] }
      - { name: url, label: "Website URL", widget: string, required: false }
      - { name: thumb, label: "Card image", widget: image, required: false }
      - { name: heading, label: "Case-study title (use <b> for bold)", widget: string }
      - { name: summary, label: "Summary", widget: text }
      - { name: challenge, label: "The Challenge", widget: text }
      - { name: role, label: "My Role", widget: string }
      - { name: client, label: "Client", widget: string }
      - { name: time, label: "Project Time", widget: string }
      - { name: cover, label: "Cover image", widget: image, required: false }
      - name: sections
        label: "Story sections"
        label_singular: "Section"
        widget: list
        types:
          - label: "Banner"
            name: banner
            widget: object
            fields:
              - { name: image, label: Image, widget: image, required: false }
              - { name: title, label: Title, widget: string }
          - label: "Heading"
            name: heading
            widget: object
            fields:
              - { name: kicker, label: "Kicker (e.g. meeting #1)", widget: string, required: false }
              - { name: title, label: Title, widget: string }
          - label: "Text"
            name: text
            widget: object
            fields:
              - { name: body, label: Body, widget: text }
          - label: "Quote"
            name: quote
            widget: object
            fields:
              - { name: body, label: Quote, widget: text }
          - label: "List"
            name: list
            widget: object
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: ordered, label: "Numbered?", widget: boolean, default: true }
              - { name: items, label: Items, widget: list, field: { name: item, label: Item, widget: string } }
          - label: "Note (highlighted box)"
            name: note
            widget: object
            fields:
              - { name: body, label: Body, widget: text }
          - label: "Image"
            name: image
            widget: object
            fields:
              - { name: image, label: Image, widget: image, required: false }
              - { name: caption, label: Caption, widget: string, required: false }
          - label: "Gallery"
            name: gallery
            widget: object
            fields:
              - { name: images, label: Images, widget: list, field: { name: image, label: Image, widget: image } }
          - label: "Colors"
            name: colors
            widget: object
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - name: groups
                label: Groups
                widget: list
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: swatches, label: Swatches (hex), widget: list, field: { name: hex, label: Hex, widget: string } }

  - name: "story"
    label: "Story page"
    icon: auto_stories
    description: "Your life story, the five books / films / albums that shaped you, and what you are into right now."
    editor:
      preview: false
    files:
      - name: "story"
        label: "Story page"
        file: "content/story.json"
        format: "json"
        fields:
          - { name: intro, label: "Intro", widget: text, required: false, hint: "A short paragraph under the title. Leave a blank line between paragraphs." }
          - name: timeline
            label: "Timeline"
            label_singular: "Milestone"
            widget: list
            required: false
            summary: "{{fields.year}} - {{fields.title}}"
            hint: "Your life story as milestones, oldest first. 5-8 works well."
            fields:
              - { name: year, label: "Year", widget: string, hint: "For example 2018, or 2018-2020" }
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "What happened (1-3 sentences)", widget: text, required: false }
          - name: building
            label: "Currently building"
            label_singular: "Project"
            widget: list
            required: false
            max: 4
            summary: "{{fields.title}}"
            hint: "Projects you are working on right now. Shown right after the intro."
            fields:
              - { name: title, label: "Name", widget: string }
              - { name: url, label: "Website URL", widget: string, required: false }
              - { name: status, label: "Status chip", widget: string, required: false, hint: "For example: Live - still growing" }
              - { name: tagline, label: "One-line description", widget: string, required: false }
              - { name: body, label: "Story", widget: text, required: false, hint: "Leave a blank line between paragraphs." }
              - { name: logo, label: "Logo", widget: image, required: false, hint: "Small square image, shown next to the name." }
              - { name: action, label: "Button text", widget: string, required: false, hint: "For example: Plant an honest day, or Next tee. The button steps through the images below." }
              - { name: crisp, label: "Pixel-art images (crisp edges)", widget: boolean, default: false, required: false, hint: "Turn on if the images are pixel art, so they stay sharp when enlarged." }
              - name: images
                label: "Images"
                label_singular: "Image"
                widget: list
                required: false
                summary: "{{fields.title}}"
                hint: "Pictures the button steps through. Each new one appears as pixel blocks that sharpen. They replace the pixel scene."
                fields:
                  - { name: src, label: "Image", widget: image }
                  - { name: title, label: "Title", widget: string, required: false }
                  - { name: caption, label: "Caption", widget: string, required: false }
              - { name: art, label: "Pixel scene (used only if there are no images)", widget: select, options: [{ label: "Pixel island (grows when clicked)", value: island }, { label: "Pixel T-shirt (changes when clicked)", value: tee }, { label: "None", value: none }], default: none, required: false }
              - { name: case, label: "Case study ID", widget: string, required: false, hint: "The ID of a project on the Work page, for example stillhere. Adds a Read the case study link." }
          - name: books
            label: "Books that shaped me"
            label_singular: "Book"
            widget: list
            required: false
            max: 5
            summary: "{{fields.title}} - {{fields.creator}}"
            hint: "Up to five. Cover images are shown as pixel art and show the real cover on hover or tap."
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: creator, label: "Author", widget: string, required: false }
              - { name: year, label: "Year", widget: string, required: false }
              - { name: note, label: "Why it shaped me (1-2 sentences)", widget: text, required: false }
              - { name: cover, label: "Cover image", widget: image, required: false, hint: "Small is fine (about 600px wide). Without one, a type-only tile is shown." }
          - name: movies
            label: "Films that shaped me"
            label_singular: "Film"
            widget: list
            required: false
            max: 5
            summary: "{{fields.title}} - {{fields.creator}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: creator, label: "Director", widget: string, required: false }
              - { name: year, label: "Year", widget: string, required: false }
              - { name: note, label: "Why it shaped me (1-2 sentences)", widget: text, required: false }
              - { name: cover, label: "Poster image", widget: image, required: false, hint: "Small is fine (about 600px wide). Without one, a type-only tile is shown." }
          - name: albums
            label: "Albums that shaped me"
            label_singular: "Album"
            widget: list
            required: false
            max: 5
            summary: "{{fields.title}} - {{fields.creator}}"
            fields:
              - { name: title, label: "Album", widget: string }
              - { name: creator, label: "Artist", widget: string, required: false }
              - { name: year, label: "Year", widget: string, required: false }
              - { name: note, label: "Why it shaped me (1-2 sentences)", widget: text, required: false }
              - { name: cover, label: "Cover image", widget: image, required: false, hint: "Small is fine (about 600px wide). Without one, a type-only tile is shown." }
          - name: now
            label: "Now"
            widget: object
            required: false
            hint: "What you are into at the moment. Easy to refresh."
            fields:
              - { name: reading, label: "Reading", widget: string, required: false }
              - { name: watching, label: "Watching", widget: string, required: false }
              - { name: listening, label: "Listening to", widget: string, required: false }
